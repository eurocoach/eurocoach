<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurocoach - Reserva tu Cita</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #003366;
            color: #fff;
            padding: 15px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .description {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
        }

        .description h2 {
            font-size: 1.5em;
            color: #003366;
            margin-bottom: 10px;
        }

        .description p {
            font-size: 1em;
            line-height: 1.5;
            margin: 0;
        }

        .calendar-container {
            width: 100%;
            height: 80vh; /* Ocupa el 80% del alto de la pantalla */
            margin: 0 auto;
            overflow: hidden;
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            background-color: #003366;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }

        footer p {
            margin: 0;
            font-size: 0.9em;
        }

        /* Ajustes para móviles */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5em;
            }

            .description h2 {
                font-size: 1.2em;
            }

            .description p {
                font-size: 0.9em;
            }

            .calendar-container {
                height: 85vh; /* Ocupa más espacio en móviles */
            }
        }

        @media (max-width: 480px) {
            .calendar-container {
                height: 90vh; /* Ajuste adicional para pantallas muy pequeñas */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Eurocoach</h1>
    </header>

    <div class="container">
        <div class="description">
            <h2>Reserva tu Cita</h2>
            <p>Selecciona una fecha y hora conveniente para tu sesión de coaching. Estamos aquí para ayudarte a alcanzar tus metas.</p>
        </div>

        <div class="calendar-container">
            <iframe src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3mfjofNOxF0fxcUf-vYYI11DeJDYwb_mbzBlQLAej0MGfjBVR9P4fGx2reW6k9sPjndG0biuMz" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Eurocoach. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
