<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones Eurocoach - Calendario</title>
    <style>
        /* Estilos generales */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Contenedor principal */
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Encabezado */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #bdc3c7;
        }

        /* Contenedor del calendario */
        .calendar-container {
            flex: 1;
            padding: 20px;
            background-color: white;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Iframe del calendario */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        /* Pie de página */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Encabezado -->
        <header>
            <h1>Sesiones Eurocoach</h1>
            <p>Tu agenda de sesiones de coaching en un solo lugar</p>
        </header>

        <!-- Contenedor del calendario -->
        <div class="calendar-container">
            <iframe src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3mfjofNOxF0fxcUf-vYYI11DeJDYwb_mbzBlQLAej0MGfjBVR9P4fGx2reW6k9sPjndG0biuMz"></iframe>
        </div>

        <!-- Pie de página -->
        <footer>
            <p>&copy; 2023 Sesiones Eurocoach. Todos los derechos reservados. | <a href="#">Política de privacidad</a></p>
        </footer>
    </div>
</body>
</html>
