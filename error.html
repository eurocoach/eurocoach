<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones Coaching / Eurocoach - Sandy Vera</title>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6B5B95;      /* Morado suave */
            --secondary-color: #34495e;     /* Azul oscuro suave */
            --accent-color: #9B8BBA;        /* Morado más claro */
            --background-color: #F8F7FF;    /* Fondo muy suave */
            --text-color: #2C3E50;          /* Color texto principal */
            --white: #FFFFFF;
            --neumann-color: #4CAF50;       /* Verde para Neumann */
            --autonoma-color: #E91E63;      /* Rosa para Autónoma */
            --highlight-color: #FF9800;     /* Naranja para resaltar */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .calendar-container {
            flex: 1;
            padding: 1rem;
            margin: 1rem auto;
            width: 98%;
            max-width: 1600px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(107, 91, 149, 0.1);
            position: relative;
            overflow: hidden;
        }

        .calendar-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        iframe {
            width: 100%;
            height: calc(100vh - 180px);
            border: none;
            border-radius: 8px;
        }

        footer {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: var(--white);
            text-align: center;
            padding: 0.8rem;
            margin-top: auto;
        }

        footer p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        /* Estilos para el Sweet Alert personalizado */
        .custom-alert-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .institution-box {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 500;
        }

        .neumann-box {
            background-color: rgba(76, 175, 80, 0.1);
            border: 2px solid var(--neumann-color);
        }

        .autonoma-box {
            background-color: rgba(233, 30, 99, 0.1);
            border: 2px solid var(--autonoma-color);
        }

        .highlight-field {
            background: linear-gradient(120deg, var(--highlight-color) 0%, var(--highlight-color) 100%);
            background-repeat: no-repeat;
            background-size: 100% 0.2em;
            background-position: 0 88%;
            padding: 2px 4px;
            font-weight: 600;
            color: #000;
            border-radius: 4px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.6rem;
            }

            header p {
                font-size: 0.9rem;
            }

            .calendar-container {
                padding: 0.5rem;
                margin: 0.5rem;
                width: 95%;
            }

            iframe {
                height: calc(100vh - 160px);
            }
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            animation: fadeIn 0.8s ease-out;
        }

        .calendar-container {
            animation: fadeIn 1s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sesiones Coaching / Eurocoach</h1>
            <p>Coach Sandy Vera - Tu camino hacia el éxito personal y profesional</p>
        </header>

        <div class="calendar-container">
            <iframe src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3mfjofNOxF0fxcUf-vYYI11DeJDYwb_mbzBlQLAej0MGfjBVR9P4fGx2reW6k9sPjndG0biuMz"></iframe>
        </div>

        <footer>
            <p>&copy; 2025 Sesiones Coaching / Eurocoach - Sandy Vera | <a href="#">Política de privacidad</a></p>
        </footer>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Swal.fire({
                title: '¡Información Importante!',
                html: `
                    <div style="text-align: left; padding: 10px;">
                        <h3 style="color: #333; margin-bottom: 15px; text-align: center;">Registro de Sesiones de Coaching</h3>
                        
                        <p style="margin-bottom: 20px; font-size: 1.1em; color: #444;">
                            Al momento de registrar tu sesión, es <strong>OBLIGATORIO</strong> completar el campo 
                            <span class="highlight-field" style="background-color: rgba(255, 152, 0, 0.2); border: 2px solid #FF9800;">
                                "Programa académico"
                            </span> 
                            de la siguiente manera:
                        </p>

                        <div class="custom-alert-box">
                            <div class="institution-box neumann-box">
                                <strong style="color: var(--neumann-color);">Estudiantes Neumann:</strong>
                                <ul style="list-style: none; margin-top: 10px;">
                                    <li>✓ Escribir exactamente: <strong style="color: var(--neumann-color);">"Neumann + ciclo"</strong></li>
                                    <li style="margin-top: 8px;">⚠️ <strong>IMPORTANTE:</strong> Solo para estudiantes de:</li>
                                    <li style="margin-left: 20px;">• 4TO a 6TO Ciclo</li>
                                    <li style="color: #d32f2f; margin-top: 8px;">❌ No se atenderán otros casos</li>
                                </ul>
                            </div>

                            <div class="institution-box autonoma-box">
                                <strong style="color: var(--autonoma-color);">Estudiantes Autónoma:</strong>
                                <ul style="list-style: none; margin-top: 10px;">
                                    <li>✓ Escribir exactamente: <strong style="color: var(--autonoma-color);">"Autónoma + Master en"</strong></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'Entendido',
                confirmButtonColor: '#6B5B95',
                width: '600px',
                showCloseButton: true,
                allowOutsideClick: false,
                customClass: {
                    popup: 'swal-wide',
                    title: 'swal-title',
                    content: 'swal-content'
                }
            });
        });
    </script>
</body>
</html>
